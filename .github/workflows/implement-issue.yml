# Lets a maintainer ask for an issue to be assessed and, if it is real and reproducible,
# fixed as a pull request, ready for review, by the shared workflow of
# menil/issue-and-pr-agent-actions (called by @v1, the latest 1.x release). Read "Issue
# implementation" in that repository's README first. It needs the repository setting "Allow
# GitHub Actions to create and approve pull requests", it uses the Claude subscription token,
# and the model only ever runs the commands named below.
#
# It starts only when someone with write access applies the ready-to-implement label. To
# have a maintainer's own new issues worked on automatically, set the repository variable
# AGENT_AUTO to true; it is off. Add the no-agent label to keep the agent off an issue.
#
# The jobs, the guard and what each job may touch are in that shared workflow, so this file
# changes only for this repository's own settings. To hold a fixed version instead of @v1,
# call the full commit of a release, with the release in a comment; Dependabot can then bump it.
name: Implement issue

on:
  issues:
    types: [opened, labeled]

# Nothing by default; the one job below asks for what the jobs it calls need between them.
permissions: {}

# One run per issue, queued and never cancelled halfway.
concurrency:
  group: implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # The most the called jobs need between them. Each of them asks for less, and none asks
    # for `workflows`.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: menil/issue-and-pr-agent-actions/.github/workflows/implement.yml@v1
    with:
      agent_auto: ${{ vars.AGENT_AUTO }}
      daily_cap: ${{ vars.AGENT_DAILY_CAP }}
      # The project's tools (uv, just, Python, Pulumi) come from its shell.nix.
      install_nix: true
      assess_command_tools: "Bash(nix-shell --run 'just test')"
      # The tests, and the full check (format, lint, type check, tests), so a change can be
      # made to pass what the project's own validation will ask.
      fix_command_tools: "Bash(nix-shell --run 'just test'),Bash(nix-shell --run 'just validate')"
      repository_notes: |
        pulumi-reolink is a Pulumi provider, in Python, that manages Reolink cameras and
        doorbells over HTTP. The code is in pulumi_reolink/, the tests are in tests/ and the
        technical specification is specs/spec.md. Run the tests with
        `nix-shell --run 'just test'`, exactly like that: they use pytest and need no camera.
      fix_repository_notes: |
        pulumi-reolink is a Pulumi provider, in Python, that manages Reolink cameras and
        doorbells over HTTP. The code is in pulumi_reolink/, the tests are in tests/ and the
        technical specification is specs/spec.md. Run the tests with
        `nix-shell --run 'just test'` and the full check (format, lint, type check, tests)
        with `nix-shell --run 'just validate'`, exactly like that. The tests need no camera.
        Add a regression test next to the existing ones for any behaviour you change, and keep
        the coverage the tests enforce.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
